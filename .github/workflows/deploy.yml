name: CI/CD — Build, Test & Deploy

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:            # allow manual trigger from dashboard

env:
  REGISTRY:       ghcr.io
  IMAGE_BACKEND:  ghcr.io/${{ github.repository_owner }}/devops-copilot-backend
  IMAGE_AI:       ghcr.io/${{ github.repository_owner }}/devops-copilot-ai
  IMAGE_FRONTEND: ghcr.io/${{ github.repository_owner }}/devops-copilot-frontend

jobs:
  # ─── 1. Backend lint + test ─────────────────────────────────────────────────
  backend-ci:
    name: Backend — Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Test
        run: npm test --if-present

  # ─── 2. AI Service lint + test ──────────────────────────────────────────────
  ai-ci:
    name: AI Service — Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: pip install ruff && ruff check . --select E,F --ignore E501 || true

      - name: Smoke test — model trains and predicts
        run: |
          python - <<'EOF'
          from core.model_manager import ModelManager
          m = ModelManager()
          m.load_or_train()
          result = m.predict({
            "build_duration": 120, "build_status": 0, "deploy_status": 0,
            "commit_sha_len": 40,  "retry_count": 0
          })
          assert 0.0 <= result["failure_probability"] <= 1.0, "Prediction out of range"
          print(f"Smoke test passed — prob={result['failure_probability']}, risk={result['risk_level']}")
          EOF

  # ─── 3. Frontend build ──────────────────────────────────────────────────────
  frontend-ci:
    name: Frontend — Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: /api

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # ─── 4. Build & push Docker images ─────────────────────────────────────────
  docker-build:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [backend-ci, ai-ci, frontend-ci]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BACKEND }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata (ai-service)
        id: meta-ai
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_AI }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build & push AI service
        uses: docker/build-push-action@v5
        with:
          context: ./ai-service
          push: true
          tags: ${{ steps.meta-ai.outputs.tags }}
          labels: ${{ steps.meta-ai.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── 5. Deploy to Kubernetes ────────────────────────────────────────────────
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "v1.30.0"

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Set image tags
        run: |
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV

      - name: Update backend deployment image
        run: |
          kubectl set image deployment/devops-copilot-backend \
            backend=${{ env.IMAGE_BACKEND }}:sha-${{ env.SHORT_SHA }} \
            -n devops-copilot

      - name: Update AI service deployment image
        run: |
          kubectl set image deployment/devops-copilot-ai \
            ai-service=${{ env.IMAGE_AI }}:sha-${{ env.SHORT_SHA }} \
            -n devops-copilot

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/devops-copilot-backend -n devops-copilot --timeout=3m
          kubectl rollout status deployment/devops-copilot-ai       -n devops-copilot --timeout=3m

      - name: Verify deployment health
        run: |
          kubectl get pods -n devops-copilot
          kubectl get svc  -n devops-copilot

      - name: Notify DevOps Copilot API
        if: always()
        run: |
          curl -s -X POST "${{ secrets.COPILOT_API_URL }}/api/deployments" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.COPILOT_API_TOKEN }}" \
            -d '{
              "serviceId":      "${{ secrets.COPILOT_SERVICE_ID }}",
              "commitSha":      "${{ github.sha }}",
              "commitMessage":  "${{ github.event.head_commit.message }}",
              "branch":         "${{ github.ref_name }}"
            }' || echo "Notification failed (non-critical)"
