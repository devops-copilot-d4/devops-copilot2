apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devops-copilot-ingress
  namespace: devops-copilot
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    # Uncomment for TLS with cert-manager:
    # cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  # tls:
  #   - hosts:
  #       - devops-copilot.yourdomain.com
  #     secretName: devops-copilot-tls
  rules:
    - host: devops-copilot.local   # change to your domain
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: devops-copilot-backend
                port:
                  number: 80
          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: devops-copilot-backend
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: devops-copilot-frontend
                port:
                  number: 80
