global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    cluster: devops-copilot-local

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  # Prometheus self-monitoring
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  # DevOps Copilot backend (Node.js — expose /metrics with prom-client)
  - job_name: copilot-backend
    static_configs:
      - targets: [backend:5000]
    metrics_path: /metrics

  # AI microservice (FastAPI — add prometheus-fastapi-instrumentator if needed)
  - job_name: copilot-ai
    static_configs:
      - targets: [ai-service:8000]
    metrics_path: /metrics

  # Kubernetes node metrics (when running in cluster)
  - job_name: kubernetes-nodes
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)

  # Kubernetes pod metrics (auto-discover pods with prometheus.io/scrape=true)
  - job_name: kubernetes-pods
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - action: labelmap
        regex: __meta_kubernetes_pod_label_(.+)
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: kubernetes_namespace
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: kubernetes_pod_name
